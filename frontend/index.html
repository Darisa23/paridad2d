<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Demostración en vivo de paridad bidimensional (código producto)." />
    <title>Simulador de paridad bidimensional</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%230077b6'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%23d98300'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%23d98300'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%23138a5b'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem('paridad.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var s = parseFloat(localStorage.getItem('paridad.scale') || '')
        if (s >= 0.8 && s <= 1.5) document.documentElement.style.fontSize = s * 100 + '%'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
