# Plan B: backend en Render (el front puede quedar en Vercel, Netlify o Render Static).
services:
  - type: web
    name: paridad-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CORS_ORIGINS
        value: "*" # cámbialo por la URL de tu front, p. ej. https://paridad.vercel.app
